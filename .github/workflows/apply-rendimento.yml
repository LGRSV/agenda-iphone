name: Publicar rendimento automatico dos cofrinhos
on:
  push:
    paths:
      - "rendimento.patch"
      - ".github/workflows/apply-rendimento.yml"
permissions:
  contents: write
jobs:
  apply-rendimento:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar patch exatamente
        shell: bash
        run: |
          if [ ! -f rendimento.patch ]; then echo "Patch ainda nao enviado"; exit 0; fi
          git apply --index --unidiff-zero rendimento.patch
          git rm --cached rendimento.patch .github/workflows/apply-rendimento.yml
          rm -f rendimento.patch .github/workflows/apply-rendimento.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Jarvis: conta XP nos investimentos"
          git push origin HEAD:main
