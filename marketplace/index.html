<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="app-page" content="marketplace">
<title>Oportunidades Marketplace</title>
<meta name="theme-color" content="#050506">
<script>try{if(localStorage.getItem('agenda_lagares_theme')==='light')document.documentElement.dataset.theme='light'}catch(_){}</script>
<style>
/* mesmas cores, fonte e cantos do Jarvis (agenda-iphone/index.html): escuro por padrão, claro se a agenda estiver no modo claro */
:root{color-scheme:dark;--bg:#050506;--surface:#0c0c0f;--soft:#15151a;--soft2:#202027;--text:#f8f8fa;--muted:#afb0b8;--faint:#7b7d87;--line:#2e2e36;--accent:#75cbff;--accent2:#3baee8;--accentInk:#061b26;
 --ok:#6fdc9a;--bad:#ff9c9c;--warn:#f5c451;--shadow:0 14px 34px rgba(0,0,0,.5)}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f6fa;--surface:#fff;--soft:#f5f7fb;--soft2:#e8edf4;--text:#18212d;--muted:#657080;--faint:#8993a1;--line:#dfe5ed;--accent:#147fb7;--accent2:#0d72aa;--accentInk:#fff;
 --ok:#1a8a4a;--bad:#ba3e3e;--warn:#a86b00;--shadow:0 12px 28px rgba(27,40,58,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.01em}
button,input,select{font:inherit}button{cursor:pointer}
.in{width:min(100%,1180px);margin:0 auto;padding:0 16px}
/* topo */
.topbar{display:flex;align-items:flex-start;gap:12px;padding:calc(18px + env(safe-area-inset-top)) 0 14px}
.voltar{display:grid;place-items:center;flex:none;width:46px;height:46px;border:1px solid var(--line);border-radius:15px;background:var(--surface);color:var(--text);text-decoration:none;transition:transform .14s cubic-bezier(.23,1,.32,1)}
.voltar svg{width:20px;height:20px}
.eyebrow{display:block;margin-bottom:6px;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
h1{margin:0;font-size:clamp(28px,7vw,40px);line-height:.98;letter-spacing:-.06em}
.sub{display:block;margin-top:8px;color:var(--muted);font-size:13.5px}
/* abas das buscas (segmentado do Jarvis), presas no alto */
.barra{position:sticky;top:0;z-index:5;padding:8px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#cats{display:flex;gap:4px;overflow-x:auto;padding:4px;border:1px solid var(--line);border-radius:15px;background:var(--soft);scrollbar-width:none}#cats::-webkit-scrollbar{display:none}
#cats button{flex:1 0 auto;min-height:37px;padding:0 14px;border:0;border-radius:11px;background:transparent;color:var(--muted);font-size:13px;font-weight:800;white-space:nowrap;transition:transform .14s cubic-bezier(.23,1,.32,1)}
#cats button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 7px rgba(0,0,0,.16)}#cats button small{margin-left:3px;color:var(--faint);font-weight:700}
#cats button:active,.views button:active,.c:active,.voltar:active{transform:scale(.96)}
/* visões (chips) */
.views{display:flex;gap:8px;overflow-x:auto;padding:12px 1px 2px;scrollbar-width:none}.views::-webkit-scrollbar{display:none}
.views button{flex:0 0 auto;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--text);font-size:13px;font-weight:700;transition:transform .14s cubic-bezier(.23,1,.32,1)}
.views button.on{border-color:var(--accent);background:var(--accent);color:var(--accentInk)}
/* resumo */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 0;padding:16px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,var(--surface),var(--soft));box-shadow:var(--shadow)}
.st b{display:block;font-size:26px;font-weight:800;letter-spacing:-.06em;line-height:1.1}.st span{color:var(--muted);font-size:12px;font-weight:650}
.aviso{margin:12px 0 0;padding:12px 13px;border:1px solid var(--line);border-radius:15px;background:var(--soft);color:var(--muted);font-size:13px;line-height:1.45}
.aviso:before{content:"⚠ ";color:var(--warn)}
.aviso.viagem{display:block;border-color:var(--accent);color:var(--text);font-weight:750;text-decoration:none}.aviso.viagem:before{content:none}
h3{display:flex;align-items:baseline;gap:8px;margin:24px 0 0;font-size:17px;letter-spacing:-.025em}h3 small{color:var(--muted);font-size:12px;font-weight:700}
/* filtros */
.filtros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:8px;padding:12px 0 4px}
.filtros select,.filtros input{width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:13px;outline:0;background:var(--soft);color:var(--text);font-size:15px}
.filtros select:focus,.filtros input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.filtros [hidden]{display:none}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;padding:12px 0}
.row{display:grid;grid-auto-flow:column;grid-auto-columns:205px;gap:12px;overflow-x:auto;padding:12px 1px 14px}
.c{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;transition:transform .14s cubic-bezier(.23,1,.32,1),border-color .14s}
.c:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.c.hi{border-color:color-mix(in srgb,var(--warn) 60%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--warn) 9%,var(--surface)),var(--surface))}
.ph{display:block;width:100%;aspect-ratio:1;background-color:#000;background-repeat:no-repeat}
.n{position:relative}.n .cnt{position:absolute;right:8px;bottom:8px;padding:3px 8px;border-radius:999px;background:#000b;color:#fff;font-size:11px;font-weight:700}
.n .pct{position:absolute;left:8px;top:8px;padding:4px 9px;border-radius:999px;color:#fff;font-size:12px;font-weight:800}
.pct.low{background:#14874a}.pct.high{background:#b93636}
.n .nv{position:absolute;right:8px;top:8px;padding:4px 9px;border-radius:999px;background:var(--accent);color:var(--accentInk);font-size:10.5px;font-weight:850;letter-spacing:.04em}
.c .b{padding:11px 12px 13px}.p{font-size:19px;font-weight:800;letter-spacing:-.04em}.p s{color:var(--faint);font-size:13px;font-weight:600;letter-spacing:0}
.t{display:-webkit-box;margin:2px 0 4px;overflow:hidden;font-size:14px;font-weight:650;line-height:1.35;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.m{color:var(--muted);font-size:12.5px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{--tag:var(--faint);display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border:1px solid color-mix(in srgb,var(--tag) 44%,var(--line));border-radius:999px;background:color-mix(in srgb,var(--tag) 14%,transparent);color:var(--text);font-size:10.5px;font-weight:800;line-height:1.2}
.tag:before{content:"";width:6px;height:6px;flex:none;border-radius:50%;background:var(--tag)}
.tag.low{--tag:var(--ok)}.tag.high{--tag:var(--bad)}.tag.warn{--tag:var(--warn)}
.why{margin-top:8px;padding:7px 9px;border-radius:11px;background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);font-size:12px;font-weight:650;line-height:1.35}
.vazio{grid-column:1/-1;padding:40px 18px;border:1px dashed var(--line);border-radius:21px;color:var(--muted);text-align:center}
/* tabelas */
.painel{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.painel h2{margin:0 0 6px;font-size:18px;letter-spacing:-.03em}.tw{overflow-x:auto}
table.md{width:100%;margin:12px 0;border-collapse:collapse;font-size:14px}
table.md td,table.md th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.md th{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
table.md td:first-child,table.md th:first-child{text-align:left}table.md tr.z td{color:var(--faint)}
.pos{display:inline-grid;place-items:center;width:22px;height:22px;margin-right:8px;border-radius:50%;background:var(--accent);color:var(--accentInk);font-size:11px;font-weight:850}
.trk{display:inline-block;width:90px;height:8px;margin-right:8px;overflow:hidden;border-radius:99px;background:var(--soft2);vertical-align:middle}
.trk i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent2),var(--accent))}
/* janela do anúncio */
#mod{position:fixed;inset:0;z-index:10;display:none;padding:16px;overflow:auto;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#mod .box{display:grid;grid-template-columns:1.2fr 1fr;max-width:1000px;margin:0 auto;overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 30px 90px rgba(0,0,0,.56)}
.gal{position:relative;display:flex;flex-direction:column;background:#000}.gal .big{width:100%;max-height:70vh;margin:0 auto;aspect-ratio:1}
.gal .nav{position:absolute;top:40%;width:44px;height:44px;border:0;border-radius:50%;background:#0009;color:#fff;font-size:28px}
.prev{left:8px}.next{right:8px}.th{display:flex;gap:4px;overflow-x:auto;padding:6px;background:#0b0b0d}
.th .ph{width:58px;height:58px;flex:none;border-radius:8px;opacity:.55;cursor:pointer}.th .ph.on{opacity:1;outline:2px solid var(--accent)}
.det{max-height:85vh;padding:20px;overflow:auto}.det h2{margin:0 0 6px;font-size:21px;letter-spacing:-.045em}
.desc{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acts a{padding:11px 15px;border:1px solid var(--accent);border-radius:13px;background:var(--accent);color:var(--accentInk);font-size:14px;font-weight:750;text-decoration:none}
.x{float:right;display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--muted);font-size:22px;line-height:1}
footer{padding:24px 0 calc(40px + env(safe-area-inset-bottom));color:var(--faint);font-size:12px}
@media (max-width:760px){#mod{padding:8px}#mod .box{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;padding:14px}.filtros{grid-template-columns:1fr 1fr}.filtros input{grid-column:1/-1}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.row{grid-auto-columns:46%}.c{border-radius:17px}.p{font-size:17px}.c .b{padding:9px 10px 11px}}
/* cofre: os anúncios vêm criptografados; só abrem com a senha de quem foi liberado (privado.py) */
html.trancado body>*:not(header):not(#cofre){display:none!important}
#cofre{display:none;max-width:420px;margin:8vh auto 0;padding:0 16px}
html.trancado #cofre{display:block}
#cofre form{display:grid;gap:12px;padding:22px;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:var(--shadow)}
#cofre h2{margin:0;font-size:20px}#cofre p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
#cofre input[type=password]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:var(--soft);color:var(--text);font:inherit;font-size:16px}
#cofre label{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
#cofre button{padding:13px;border:0;border-radius:15px;background:var(--accent);color:var(--accentInk);font:inherit;font-weight:750;font-size:15px}
#cofre button:disabled{opacity:.6}#cofreMsg{min-height:1.2em;font-size:14px;color:var(--muted)}#cofreMsg.erro{color:var(--bad)}
.esquecer{display:block;margin:-30px 0 40px;color:var(--faint);font-size:12px;background:none;border:0;padding:0;text-decoration:underline}
</style></head><body>
<header class="in"><div class="topbar"><a class="voltar" href="../" aria-label="Voltar para a agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
<div><span class="eyebrow">Marketplace · Palmas/TO</span><h1>Oportunidades</h1><span class="sub" id="sub"></span></div></div></header>
<div id="cofre"><form id="cofreForm" autocomplete="on"><h2>🔒 Acesso restrito</h2>
<p>Os anúncios desta página são criptografados. Digite a sua senha de acesso.</p>
<input type="text" name="username" value="marketplace" autocomplete="username" hidden>
<input id="cofreSenha" type="password" autocomplete="current-password" placeholder="Senha" required>
<label><input id="cofreLembrar" type="checkbox" checked> Lembrar neste aparelho</label>
<button id="cofreBotao">Entrar</button><div id="cofreMsg" role="status"></div></form></div>
<div class="barra"><div class="in"><nav id="cats"></nav></div></div>
<div class="in">
<div class="views" id="views"><button data-v="a">🛒 Anúncios</button><button data-v="m">💲 Preço médio</button><button data-v="r">📈 Ranking de vendas</button></div>
<section id="va">
 <div class="stats" id="stats"></div>
 <div class="aviso" id="aviso"></div>
 <div id="novosbox"><h3>🆕 Novos desde ontem <small id="nnov"></small></h3><div class="row" id="novos"></div></div>
 <div id="topbox"><h3>⭐ Melhores oportunidades <small id="ntop"></small></h3><div class="row" id="top"></div></div>
 <h3>Todos os anúncios <small id="ntodos"></small></h3>
 <div class="filtros"><select id="mods"></select>
 <select id="ord"><option value="p">Menor preço</option><option value="P">Maior preço</option><option value="v">Mais abaixo da média</option><option value="n">Mais recentes primeiro</option></select>
 <select id="bat"><option value="75">🔋 Bateria 75%+ ou não informada</option><option value="75c">🔋 Só bateria 75%+ confirmada</option><option value="">🔋 Qualquer bateria</option></select>
 <input id="q" type="search" placeholder="Buscar no título ou descrição…"></div>
 <main class="grid" id="g"></main>
</section>
<section id="vm" hidden><div class="painel" id="medias"></div></section>
<section id="vr" hidden><div class="painel" id="vendas"></div></section>
<footer id="rod"></footer>
</div>
<div id="mod"><div class="box"><div class="gal"><div class="big ph" id="big"></div><button class="nav prev" id="pv">‹</button><button class="nav next" id="nx">›</button><div class="th" id="th"></div></div>
<div class="det" id="det"></div></div></div>
<script type="text/plain" id="app">
const D=window.__D;
const GOLPE=(()=>{try{return JSON.parse(localStorage.getItem('golpe')||'{"a":[],"v":[]}')}catch(e){return{a:[],v:[]}}})();
const golpeOculto=d=>GOLPE.a.includes(d.id)||(d.vendedor&&GOLPE.v.includes(d.vendedor));
for(let i=D.length-1;i>=0;i--)if(golpeOculto(D[i]))D.splice(i,1);
function golpeLink(d){const corpo=`Vendedor: ${d.vendedor||'(o script descobre)'}\nAnúncio: ${d.titulo} | R$ ${d.preco}\n${d.link}\n\nNa próxima rodada (de 2 em 2 horas) o script tira os anúncios desse vendedor do site e fecha esta issue.`;
 return `https://github.com/LGRSV/marketplace/issues/new?title=${encodeURIComponent('golpista '+d.id)}&body=${encodeURIComponent(corpo)}`}
function golpeBotao(d){return `${d.vendedor?`<div class="m" style="margin-top:6px">Vendedor: ${esc(d.vendedor)}</div>`:''}<div class="acts"><a href="${golpeLink(d)}" target="_blank" rel="noopener" style="background:transparent;border-color:var(--bad);color:var(--bad)" onclick="golpeMarcar('${d.id}')">🚩 Marcar como golpista</a></div>`}
function golpeMarcar(id){const d=D.find(x=>x.id===id);if(!d)return;GOLPE.a.push(id);if(d.vendedor)GOLPE.v.push(d.vendedor);
 try{localStorage.setItem('golpe',JSON.stringify(GOLPE))}catch(e){}
 const fora=D.filter(golpeOculto).map(x=>x.id);fora.forEach(i=>document.querySelectorAll(`.c[data-id="${i}"]`).forEach(e=>e.remove()));
 for(let i=D.length-1;i>=0;i--)if(golpeOculto(D[i]))D.splice(i,1);setTimeout(fechar,300)}

const R=window.__R;
const $=id=>document.getElementById(id);
const bg=(d,i)=>`background-image:url(${d.tira});background-size:${d.nf*100}% 100%;background-position:${d.nf>1?i/(d.nf-1)*100:0}% 0`;
const fmt=v=>'R$ '+v.toLocaleString('pt-BR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICONE={'iPhone':'📱','Galaxy':'📲','Videogame':'🎮','TV':'📺','Jogos e acessórios':'🕹️'};
const ORDEM=['iPhone','Galaxy','Videogame','TV','Jogos e acessórios'];
const cats=[...new Set(D.map(d=>d.cat))].sort((a,b)=>((ORDEM.indexOf(a)+99)%99)-((ORDEM.indexOf(b)+99)%99)||a.localeCompare(b));
let cat=cats[0],view='a',cur=null,idx=0;
try{const [c,v]=decodeURIComponent(location.hash.slice(1)).split('/');if(cats.includes(c))cat=c;if(['a','m','r'].includes(v))view=v}catch(_){}
const daCat=()=>D.filter(d=>d.cat===cat);
function tags(d){let t='';if(d.vs_media!=null)t+=`<span class="tag ${d.vs_media<0?'low':'high'}">${d.vs_media>0?'+':''}${d.vs_media}% vs média</span>`;
 if(d.novo)t+='<span class="tag low">🆕 novo</span>';return t}  // defeito, bateria e conta nova vêm do tagsCard
function tagsCard(d){let t='';if(d.bateria)t+=`<span class="tag ${d.bateria>=BAT?'low':'warn'}">🔋 ${d.bateria}%</span>`;else if(d.cat==='iPhone')t+='<span class="tag">🔋 não informada</span>';
 if(d.alerta)t+='<span class="tag warn">⚠ cita defeito</span>';if(d.conta_nova)t+=`<span class="tag warn">⚠ conta nova (${d.conta_nova})</span>`;return t?`<div class="tags">${t}</div>`:''}
const BAT=75;
const card=d=>`<div class="c${d.destaque?' hi':''}" data-id="${d.id}"><div class="n"><div class="ph" style="${bg(d,0)}"></div><span class="cnt">📷 ${d.nf}</span>
 ${d.vs_media!=null?`<span class="pct ${d.vs_media<0?'low':'high'}">${d.vs_media>0?'+':''}${d.vs_media}%</span>`:''}${d.novo?'<span class="nv">NOVO</span>':''}</div>
 <div class="b"><div class="p">${fmt(d.preco)}${d.preco_antes&&d.preco_antes!==d.preco?` <s class="m">${fmt(d.preco_antes)}</s>`:''}</div><div class="t">${esc(d.titulo)}</div>
 <div class="m">${esc(d.mod)} · ${esc(d.local.split(',')[0])}</div>${tagsCard(d)}${d.destaque?`<div class="why">⭐ ${esc(d.destaque)}</div>`:''}</div></div>`;
function abas(){
 $('cats').innerHTML=cats.map(c=>`<button class="${c===cat?'on':''}" data-c="${esc(c)}">${ICONE[c]||'🔎'} ${esc(c)} <small>${D.filter(d=>d.cat===c).length}</small></button>`).join('');
 $('views').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 ['a','m','r'].forEach(v=>$('v'+v).hidden=v!==view);
 history.replaceState(null,'','#'+encodeURIComponent(cat)+'/'+view)}
function anuncios(){const L=daCat(),N=L.filter(d=>d.novo).sort((a,b)=>(a.vs_media??99)-(b.vs_media??99)),T=L.filter(d=>d.destaque).sort((a,b)=>(a.vs_media??99)-(b.vs_media??99));
 const pr=L.map(d=>d.preco).sort((a,b)=>a-b),med=pr.length?pr[Math.floor(pr.length/2)]:0;
 $('stats').innerHTML=[[L.length,'anúncios'],[N.length,'novos desde ontem'],[T.length,'oportunidades'],[pr.length?fmt(med):'–','preço mediano']].map(([v,t])=>`<div class="st"><b>${v}</b><span>${t}</span></div>`).join('');
 $('novos').innerHTML=N.map(card).join('');$('novosbox').hidden=!N.length;$('nnov').textContent=N.length;
 $('top').innerHTML=T.map(card).join('');$('topbox').hidden=!T.length;$('ntop').textContent=T.length;
 const ms=[...new Set(L.map(d=>d.mod))].sort((a,b)=>a.localeCompare(b,'pt',{numeric:true}));
 $('mods').innerHTML='<option value="">Todos os modelos</option>'+ms.map(m=>`<option>${esc(m)}</option>`).join('');lista()}
function lista(){const mod=$('mods').value,q=$('q').value.toLowerCase(),o=$('ord').value;
 const bt=cat==='iPhone'?$('bat').value:'';$('bat').hidden=cat!=='iPhone';
 let L=daCat().filter(d=>(!mod||d.mod===mod)&&(!q||(d.titulo+' '+d.descricao).toLowerCase().includes(q))
  &&(!bt||(d.bateria?d.bateria>=BAT:bt==='75')));
 L.sort(o==='p'?(a,b)=>a.preco-b.preco:o==='P'?(a,b)=>b.preco-a.preco:o==='n'?(a,b)=>b.novo-a.novo||a.preco-b.preco:(a,b)=>(a.vs_media??99)-(b.vs_media??99));
 $('ntodos').textContent=L.length;
 $('g').innerHTML=L.length?L.map(card).join(''):'<div class="vazio">Nada encontrado.</div>'}
function medias(){const M=Object.entries(R.medias).filter(([k,v])=>v[2]===cat).sort((a,b)=>a[0].localeCompare(b[0],'pt',{numeric:true}));
 const mx=Math.max(1,...M.map(([k,v])=>v[0]));
 $('medias').innerHTML=`<h2>${ICONE[cat]||''} Preço médio — ${esc(cat)}</h2><div class="m">Coleta de ${R.data}. Sem anúncios que citam defeito, de troca ou com preço fora de 40%–250% da mediana (peça, caixa, jogo avulso).</div>`+
 (!M.length?'<div class="vazio">Esta busca não tem média por modelo (os itens são variados demais).</div>':
 '<div class="tw"><table class="md"><tr><th>Modelo</th><th>Média</th><th>Moda</th><th>Anúncios</th></tr>'+M.map(([k,[v,q,c,mo,vz]])=>`<tr${q<5?' class="z"':''}><td>${esc(k)}</td><td><span class="trk"><i style="width:${v/mx*100}%"></i></span>${fmt(v)}</td><td>${mo&&mo.length?mo.map(fmt).join(' / ')+` <span class="m">(${vz}×${mo.length>1?' cada':''})</span>`:'<span class="m">nenhum repete</span>'}</td><td>${q}${q<5?' ⚠':''}</td></tr>`).join('')+
 '</table></div><div class="m"><b>Moda</b> = o preço que mais se repete entre os anúncios do modelo (entre parênteses, quantas vezes). ⚠ menos de 5 anúncios: média pouco confiável.</div>')}
function vendas(){const V=R.vendas||{linhas:[]},br=d=>d?d.split('-').reverse().join('/'):'',f=v=>v==null?'–':fmt(v);
 const catDe=m=>(D.find(d=>d.mod===m)||{}).cat;
 const L=V.linhas.filter(l=>(l.cat||catDe(l.mod))===cat).sort((a,b)=>(b.vendidos+b.apagados)-(a.vendidos+a.apagados)||b.giro-a.giro||b.anuncios-a.anuncios);
 const S=L.filter(l=>l.vendidos+l.apagados>0),Z=L.filter(l=>l.vendidos+l.apagados===0);
 $('vendas').innerHTML=`<h2>${ICONE[cat]||''} O que mais vende — ${esc(cat)}</h2><div class="m">Histórico desde ${br(V.inicio)}. <b>Vendido</b> = marcado como vendido no Facebook. <b>Apagado</b> = anúncio removido (pode ter vendido por fora). <b>Giro</b> = (vendidos + apagados) ÷ anúncios já conferidos de novo depois que apareceram. <b>Dias até sair</b>: só os anúncios que vimos entrar no ar (os da primeira coleta já estavam lá não se sabe desde quando); entre parênteses, quantos.</div>`+
 (!L.length?'<div class="vazio">Ainda sem histórico para esta busca.</div>':
 '<div class="tw"><table class="md"><tr><th>Modelo</th><th>Vendidos</th><th>Apagados</th><th>Conferidos</th><th>Giro</th><th>Dias até sair</th><th>Preço de quem saiu</th><th>Preço dos ativos</th><th>Ainda ativos</th></tr>'+
 [...S,...Z].map((l,i)=>`<tr${l.vendidos+l.apagados?'':' class="z"'}><td>${l.vendidos+l.apagados?`<span class="pos">${i+1}</span>`:''}${esc(l.mod)}</td><td>${l.vendidos}</td><td>${l.apagados}</td><td>${l.conferidos??'–'}</td><td><span class="trk"><i style="width:${Math.min(100,l.giro)}%"></i></span>${l.giro}%</td><td>${l.dias==null?'–':(l.dias<1?'menos de 1':String(l.dias).replace('.',','))+(l.dias_n?` <span class="m">(${l.dias_n})</span>`:'')}</td><td>${f(l.preco_saiu)}</td><td>${f(l.preco_ativo)}</td><td>${l.ativos}</td></tr>`).join('')+
 `</table></div>${S.length?'':'<div class="m">Nenhum anúncio desta busca saiu do ar ainda; o ranking aparece quando os primeiros forem vendidos ou apagados.</div>'}`)}
function tudo(){abas();anuncios();medias();vendas()}
function abrir(id){cur=D.find(d=>d.id===id);idx=0;
 $('det').innerHTML=`<button class="x" id="fx">×</button><h2>${esc(cur.titulo)}</h2><div class="p">${fmt(cur.preco)}</div>
 <div class="m">${esc(cur.mod)} · ${esc(cur.local)}${cur.condicao?' · '+esc(cur.condicao):''}</div><div class="tags">${tags(cur)}</div>${tagsCard(cur)}
 ${cur.destaque?`<div class="why">⭐ ${esc(cur.destaque)}</div>`:''}
 <div class="acts"><a href="${cur.link}" target="_blank" rel="noopener">Abrir no Facebook</a></div>
 <div class="desc">${esc(cur.descricao||'(sem descrição)')}</div>${golpeBotao(cur)}`;
 $('fx').onclick=fechar;
 $('th').innerHTML=Array.from({length:cur.nf},(_,i)=>`<div class="ph" data-i="${i}" style="${bg(cur,i)}"></div>`).join('');
 foto(0);$('mod').style.display='block';document.body.style.overflow='hidden'}
function foto(i){idx=(i+cur.nf)%cur.nf;$('big').style.cssText=bg(cur,idx);
 document.querySelectorAll('#th .ph').forEach((e,k)=>e.classList.toggle('on',k===idx));
 pv.style.display=nx.style.display=cur.nf>1?'':'none'}
function fechar(){$('mod').style.display='none';document.body.style.overflow='';cur=null}
$('cats').onclick=e=>{const b=e.target.closest('button');if(b){cat=b.dataset.c;$('q').value='';tudo();scrollTo(0,0)}};
$('views').onclick=e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;abas()}};
['mods','ord','bat'].forEach(i=>$(i).onchange=lista);$('q').oninput=lista;
['g','top','novos'].forEach(i=>$(i).onclick=e=>{const c=e.target.closest('.c');if(c)abrir(c.dataset.id)});
$('th').onclick=e=>{if(e.target.dataset.i)foto(+e.target.dataset.i)};
pv.onclick=()=>foto(idx-1);nx.onclick=()=>foto(idx+1);
$('mod').onclick=e=>{if(e.target.id==='mod')fechar()};
document.onkeydown=e=>{if(!cur)return;if(e.key==='Escape')fechar();if(e.key==='ArrowLeft')foto(idx-1);if(e.key==='ArrowRight')foto(idx+1)};
$('sub').textContent=`Atualizado em ${R.data}${R.hora?' às '+R.hora:''} · ${D.length} anúncios da região`;
$('aviso').textContent='Confira no Facebook se o anúncio ainda está ativo antes de chamar o vendedor. Preço muito abaixo do normal pode ser golpe.';
$('rod').textContent='Atualizado automaticamente de 2 em 2 horas (7h–21h). Cada anúncio é comparado com a média do mesmo modelo na região de Palmas.';
// tela temporária da viagem (viagem.py): só aparece dentro do cofre, até a data final e se viagem/ ainda estiver no ar
if(R.viagem&&Date.now()<=Date.parse(R.viagem.ate+'T23:59:59-03:00'))fetch('viagem/',{method:'HEAD',cache:'no-store'}).then(r=>{if(!r.ok)return;
 const a=document.createElement('a');a.href='viagem/';a.className='aviso viagem';a.textContent='🧳 Viagem: eletrônicos baratos em '+R.viagem.rotulo+' →';$('va').prepend(a)}).catch(()=>{});
tudo();
</script>
