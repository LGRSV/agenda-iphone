<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="app-page" content="rotas.html">
  <title>Rotas do dia</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=">
  <style>
    :root{color-scheme:dark;--bg:#111216;--surface:#1c1e23;--soft:#24272e;--line:#343943;--text:#f7f8fb;--muted:#9da5b3;--accent:#75cbff;--accentInk:#06263a;--rota:#3d9bff;--sel:#ffcf4a;--lugar:#3ecf8e;--sem:#ffad42;--red:#ff7f91;--gap:#6b7280}
    *{box-sizing:border-box}html,body{height:100%}html{-webkit-text-size-adjust:100%;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
    button,input{font:inherit;color:inherit}
    .head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto}
    .back{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--soft);text-decoration:none;color:var(--text);font-size:26px;flex:0 0 auto}
    .head h1{margin:0;font-size:20px;letter-spacing:-.02em}.head .sub{margin:2px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .head .tit{flex:1;min-width:0}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:5px;vertical-align:middle}.dot.on{background:var(--lugar)}.dot.err{background:var(--red)}
    .dias{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);flex:0 0 auto}
    .dias button{min-width:44px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-weight:750;font-size:14px;padding:0 12px}
    .dias button:disabled{opacity:.35}
    .dias .data{flex:1;min-width:0;position:relative;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800}
    .dias .data input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;cursor:pointer}
    .corpo{flex:1;min-height:0;display:flex;flex-direction:column}
    .mapwrap{position:relative;flex:0 0 40%;min-height:200px}
    #map{position:absolute;inset:0;background:#2a2d33}
    .dica{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:500;padding:5px 10px;border-radius:10px;background:rgba(17,18,22,.85);color:var(--muted);font-size:11px;white-space:nowrap;pointer-events:none}
    .painel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
    .chips{display:flex;gap:8px;padding:12px 14px 4px;flex-wrap:wrap}
    .chip{flex:1 1 0;min-width:90px;padding:9px 11px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
    .chip b{display:block;font-size:19px;letter-spacing:-.02em}.chip span{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
    h2{margin:0;padding:16px 14px 6px;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
    .fonte{padding:0 14px;color:var(--muted);font-size:12px}
    .ev{display:flex;align-items:flex-start;gap:10px;width:100%;padding:9px 14px;border:0;border-bottom:1px solid rgba(52,57,67,.55);background:transparent;text-align:left;cursor:pointer}
    .ev:active{background:var(--soft)}.ev.on{background:rgba(255,207,74,.10);box-shadow:inset 3px 0 0 var(--sel)}
    .ev .hora{flex:0 0 46px;font-weight:800;font-variant-numeric:tabular-nums;padding-top:1px}
    .ev .ic{flex:0 0 14px;height:14px;margin-top:3px;border-radius:50%;background:var(--lugar)}
    .ev .ic.transito{border-radius:4px;background:var(--rota)}.ev .ic.lacuna{background:transparent;border:2px dashed var(--gap)}
    .ev .ic.sem{background:var(--sem)}.ev .ic.saida{background:transparent;border:3px solid var(--lugar)}.ev .ic.saida.sem{border-color:var(--sem)}
    .ev .tx{flex:1;min-width:0;line-height:1.35}.ev .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
    .ev.lacuna .tx{color:var(--muted)}
    .vazio{padding:14px 16px;color:var(--muted);font-size:13px;line-height:1.5}
    .semana .dia{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:10px;width:100%;padding:7px 14px;border:0;background:transparent;text-align:left;cursor:pointer}
    .semana .dia.on{background:rgba(117,203,255,.08)}
    .semana .dia b{font-size:13px}.semana .dia span{color:var(--muted);font-size:12px;white-space:nowrap}
    .barra{height:8px;border-radius:5px;background:var(--soft);overflow:hidden}.barra i{display:block;height:100%;border-radius:5px;background:var(--rota)}
    .linha{display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:14px}
    .linha .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.linha .v{color:var(--muted);font-size:13px;white-space:nowrap}
    .aviso{margin:14px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--muted);font-size:13px;line-height:1.5}
    .aviso b{color:var(--text)}
    .aviso button{margin-top:8px;min-height:40px;padding:8px 14px;border-radius:12px;border:0;background:var(--lugar);color:#05301d;font-weight:800}
    .apagar{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 10px}
    .apagar button{min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--red);font-weight:750}
    .sheet{position:fixed;inset:0;z-index:2000;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4)}
    .sheet[hidden]{display:none}
    .sheet-card{width:min(100%,520px);padding:16px 16px calc(14px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--surface);border:1px solid var(--line)}
    .sheet-card h3{margin:0 0 6px;font-size:18px}.sheet-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
    .sheet-acoes{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
    .sheet-acoes button{min-height:44px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-weight:750}
    .sheet-acoes .perigo{background:var(--red);border-color:var(--red);color:#3a0710}
    .leaflet-popup-content{margin:9px 11px;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .leaflet-control-layers{border-radius:12px!important}
    .leaflet-control-layers-expanded{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:8px 12px 8px 8px}
    .leaflet-control-layers-base label{padding:5px 0}
    .leaflet-popup-content .pl{display:inline-block;margin:6px 6px 0 0;padding:6px 9px;border:0;border-radius:8px;background:#eef1f5;color:#123;text-decoration:none;font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;cursor:pointer}
    .leaflet-popup-content .pl.verde{background:#3ecf8e;color:#05301d}
    #sugCompras .sug{padding:10px 0;border-bottom:1px solid var(--line)}
    #sugCompras .tx b{display:block;font-size:14px}#sugCompras .tx span{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.35}
    #sugCompras .bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    #sugCompras .bt button,#sugCompras .bt a{min-height:36px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--text);text-decoration:none;font:700 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:inline-flex;align-items:center}
    #sugCompras .bt .ok{background:#3ecf8e;border-color:#3ecf8e;color:#05301d}
    #sugCompras[hidden],#sugTit[hidden]{display:none}
    .aviso label.eco{display:flex;gap:9px;align-items:center;min-height:44px;margin-top:10px;cursor:pointer}.aviso label.eco input{width:22px;height:22px;flex:0 0 auto;accent-color:#3ecf8e}
    .aviso .eco-tx{display:block;color:var(--muted);font-size:12px;line-height:1.4}
    .toast{position:fixed;z-index:2100;left:16px;right:16px;margin:0 auto;bottom:calc(24px + env(safe-area-inset-bottom));width:fit-content;max-width:calc(100% - 32px);padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:#2a2e36;color:var(--text);font-size:13px;font-weight:700;line-height:1.35;opacity:0;pointer-events:none;transform:translateY(12px);transition:opacity .2s,transform .2s}
    .toast.show{opacity:1;transform:translateY(0)}
    @media (min-width:900px){
      .corpo{flex-direction:row}
      .mapwrap{flex:1 1 60%;min-height:0}
      .painel{flex:0 0 420px;border-left:1px solid var(--line)}
    }
  </style>
</head>
<body>
  <header class="head"><a class="back" href="./" aria-label="Voltar à agenda">‹</a><div class="tit"><h1>Rotas do dia</h1><p class="sub" id="status"><span class="dot"></span>carregando…</p></div></header>
  <div class="dias">
    <button id="diaAnt" type="button" aria-label="Dia anterior">‹</button>
    <label class="data"><span id="diaTxt">Hoje</span><input id="diaSel" type="date" aria-label="Escolher o dia"></label>
    <button id="diaProx" type="button" aria-label="Próximo dia">›</button>
    <button id="diaHoje" type="button">Hoje</button>
  </div>
  <div class="corpo">
    <div class="mapwrap"><div id="map" aria-label="Mapa da rota do dia"></div><div class="dica" id="dica">aproxime o mapa para ver lojas e restaurantes</div></div>
    <section class="painel" id="painel">
      <div class="chips" id="chips"></div>
      <p class="fonte" id="fonte"></p>
      <h2>Linha do tempo</h2>
      <div id="linha"><div class="vazio">Carregando…</div></div>
      <h2 id="sugTit" hidden>Sugestões de lugares (compras do dia)</h2>
      <div id="sugCompras" hidden></div>
      <h2 id="semTit">Semana</h2>
      <div class="semana" id="semana"></div>
      <h2>Tempo em cada lugar (7 dias)</h2>
      <div id="lugares"></div>
      <h2>Trechos mais repetidos (7 dias)</h2>
      <div id="repetidos"></div>
      <div class="aviso" id="aviso"></div>
      <h2>Histórico</h2>
      <div class="apagar"><button id="apagarDia" type="button">Apagar este dia</button><button id="apagarTudo" type="button">Apagar todo o histórico de rotas</button></div>
    </section>
  </div>
  <div class="sheet" id="sheet" hidden><div class="sheet-card" role="dialog" aria-labelledby="shTit">
    <h3 id="shTit"></h3><p id="shTxt"></p>
    <div class="sheet-acoes"><button id="shNao" type="button">Cancelar</button><button id="shSim" class="perigo" type="button">Apagar</button></div>
  </div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="./vendor/leaflet/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="></script>
  <script src="./localizacao.js?v=4"></script>
  <script src="./local-tarefa.js?v=3"></script>
  <script src="./rotas.js?v=3"></script>
  <script src="./estabelecimentos.js?v=1"></script>
  <script src="./sugestoes-compras.js?v=1"></script>
  <script src="./rotas-tela.js?v=3"></script>
</body>
</html>
