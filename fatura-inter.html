te-space:nowrap}.ct-val{position:relative;font-size:26px;font-weight:850;margin-top:8px}.ct-sub{position:relative;font-size:11px;opacity:.92;margin-top:2px;font-weight:600}.ct-cardbot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;gap:10px}.mc{position:relative;width:40px;height:25px;flex:0 0 auto}.mc i{position:absolute;top:0;width:25px;height:25px;border-radius:50%}.mc i:first-child{left:0;background:#eb001b}.mc i:last-child{right:0;background:#f79e1b;mix-blend-mode:screen}h2{margin:24px 0 9px;color:#a6acb8;font-size:11px;font-weight:850;letter-spacing:.09em}.list{border:1px solid #3b404a;border-radius:18px;background:#202228;overflow:hidden}.day{border-bottom:1px solid #3b404a}.day:last-child{border-bottom:0}.day-head{display:flex;justify-content:space-between;align-items:center;padding:10px 13px;background:#24262c;color:#dfe2e8;font-size:12px;font-weight:850}.day-head b{color:#ff8c9d;font-size:13px}.row{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:start;padding:13px;border-bottom:1px solid #343840}.row:last-child{border-bottom:0}.dot{display:block;width:9px;height:9px;border-radius:50%;margin-top:5px;background:#ff7f91}.title{font-weight:800;line-height:1.35}.meta{margin-top:4px;color:#a6acb8;font-size:11px;font-weight:650}.value{color:#ff8c9d;font-size:14px;font-weight:900;white-space:nowrap}.detail{margin-top:8px;padding:7px 8px;border:1px solid #363a43;border-radius:9px;color:#b9bfca;font-size:11px;line-height:1.4}.invoice-details>span{display:block;margin-bottom:6px;color:#8f96a3;font-size:9px;font-weight:850;letter-spacing:.06em;text-transform:uppercase}.invoice-detail-boxes{display:flex;flex-wrap:wrap;gap:6px}.invoice-detail-box{display:inline-flex;align-items:center;min-height:28px;padding:5px 8px;border:1px solid #3a414d;border-radius:8px;background:#252830;color:#d8dbe2;font-size:11px;line-height:1.3}.empty{padding:34px 18px;text-align:center;color:#a6acb8}.updated{padding-top:18px;text-align:center;color:#777e8b;font-size:11px;font-weight:650}@media(prefers-reduced-motion:no-preference){.slide.cartao{animation:enter .3s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes invoiceChange{from{opacity:.35;transform:translateX(12px) scale(.985)}to{opacity:1;transform:none}}}
