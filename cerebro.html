<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111216">
  <meta name="app-page" content="cerebro.html">
  <meta name="referrer" content="no-referrer">
  <title>Cérebro</title>
  <style>
    :root{color-scheme:dark;--bg:#111216;--surface:#1c1e23;--soft:#24272e;--line:#343943;--text:#f2f4f8;--muted:#9da5b3;--accent:#b18cff;--accent2:#3b2d63;--ok:#5fd39a;--warn:#ffc46b;--red:#ff7f91}
    *{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,textarea,select{font:inherit;color:inherit}
    a{color:var(--accent)}
    .head{position:sticky;top:0;z-index:5;background:rgba(28,30,35,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
    .row{display:flex;align-items:center;gap:10px}
    .btn{min-width:42px;height:42px;display:inline-grid;place-items:center;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);text-decoration:none;color:var(--text);cursor:pointer;flex:0 0 auto;font-weight:600}
    .btn.big{font-size:24px;padding:0;width:42px}
    .btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1033}
    .btn:disabled{opacity:.45}
    h1{margin:0;font-size:20px;letter-spacing:-.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .search{margin-top:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);outline:none;font-size:16px}
    main{max-width:860px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom))}
    .sec{margin:16px 0 6px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
    .list{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
    .item{display:block;padding:11px 14px;border-bottom:1px solid rgba(52,57,67,.6);text-decoration:none;color:var(--text);cursor:pointer}
    .item:last-child{border-bottom:0}.item:active{background:var(--soft)}
    .item b{font-weight:600}.item small{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item .n{float:right;color:var(--muted);font-size:13px}
    .item.sub{padding-left:28px}.item.sub2{padding-left:42px}
    .trecho{color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .trecho mark{background:var(--accent2);color:var(--text);border-radius:3px;padding:0 2px}
    .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:4px;vertical-align:middle}
    .tag.app{color:var(--accent);border-color:var(--accent2)}.tag.pend{color:var(--warn);border-color:#5a4520}.tag.ro{color:var(--red);border-color:#5a2730}
    .vazio{color:var(--muted);text-align:center;padding:30px 10px}
    .aviso{border:1px solid #5a4520;background:#2a2213;color:#ffe2b0;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
    .aviso.err{border-color:#5a2730;background:#2a1418;color:#ffc9d1}
    .crumb{color:var(--muted);font-size:13px;margin:4px 0 8px;word-break:break-word}
    .crumb a{color:var(--muted)}
    .props{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 14px;white-space:pre-wrap;word-break:break-word}
    .md{word-wrap:break-word;overflow-wrap:anywhere}
    .md h1{font-size:24px;white-space:normal;margin:18px 0 8px}.md h2{font-size:20px;margin:18px 0 8px}.md h3{font-size:17px;margin:14px 0 6px}
    .md p,.md ul,.md ol{margin:8px 0}.md ul,.md ol{padding-left:22px}
    .md code{background:var(--soft);border-radius:5px;padding:1px 5px;font-size:14px}
    .md pre{background:#0c0d10;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:13px}
    .md pre code{background:none;padding:0}
    .md blockquote{margin:8px 0;padding:4px 12px;border-left:3px solid var(--accent);color:#d4d8e0;background:rgba(177,140,255,.06);border-radius:0 8px 8px 0}
    .md table{border-collapse:collapse;display:block;overflow-x:auto;font-size:14px;margin:10px 0}
    .md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
    .md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
    .md img{max-width:100%}
    .md a.wl{text-decoration:none;border-bottom:1px dashed var(--accent)}
    .md .anexo{color:var(--muted);font-style:italic}
    .md input[type=checkbox]{transform:translateY(2px);margin-right:6px}
    .tabs{display:flex;gap:6px;margin:8px 0}
    .tabs button{flex:1;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--soft);cursor:pointer}
    .tabs button.on{background:var(--accent2);border-color:var(--accent)}
    textarea.ed{width:100%;min-height:58vh;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0c0d10;outline:none;font:15px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;-webkit-overflow-scrolling:touch}
    .campo{display:block;margin:10px 0}.campo span{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
    .campo input,.campo select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);outline:none;font-size:16px}
    details.topo{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0;color:var(--muted);font-size:13px}
    details.topo pre{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:12px}
    .barra{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
    .barra .btn{flex:1}
    .mais{width:100%;margin-top:10px}
    .status{font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
  <script>(function(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(!k||!/^sb-.*-auth-token$/.test(k))continue;var r=JSON.parse(localStorage.getItem(k)||'null'),s=r&&(r.currentSession||r.session||r);if(s&&(s.refresh_token||s.access_token))return;}}catch(_){}location.replace('./?locked=1');})();</script>
  <header class="head">
    <div class="row">
      <a class="btn big" id="voltar" href="./" aria-label="Voltar">‹</a>
      <h1 id="titulo">Cérebro</h1>
      <button class="btn big" id="novaBtn" type="button" aria-label="Nova nota" title="Nova nota">+</button>
    </div>
    <input class="search" id="busca" type="search" placeholder="Buscar no cérebro" autocomplete="off" enterkeyhint="search">
  </header>
  <main id="tela"><div class="vazio">Carregando…</div></main>
  <script src="./supabase-project-config.js?v=1"></script>
  <script type="module" src="./cerebro.js?v=1"></script>
</body>
</html>
