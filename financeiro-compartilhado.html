<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>Financeiro compartilhado</title>
  <style>
    :root{color-scheme:dark;--bg:#111216;--surface:#1d1f24;--soft:#25282f;--line:#363b45;--text:#f8f9fb;--muted:#a3aab6;--blue:#69c8ff;--green:#78d88b;--red:#ff7f91;--orange:#ffb45f}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}.head{display:flex;align-items:center;gap:12px}.back,.shortcut{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--text);text-decoration:none;flex:0 0 auto}.back{font-size:28px}.shortcut{border-color:var(--blue);color:var(--blue);font-size:20px;font-weight:900}.head>div{min-width:0;flex:1}.ey{margin:0;color:var(--blue);font-size:11px;font-weight:850;letter-spacing:.1em}.head h1{margin:3px 0;font-size:25px;letter-spacing:-.04em}.muted{margin:0;color:var(--muted);font-size:11px;line-height:1.4}.readonly{margin:18px 0 10px;padding:10px 12px;border:1px solid rgba(105,200,255,.35);border-radius:12px;background:rgba(105,200,255,.08);color:var(--blue);font-size:11px;font-weight:800}.cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:14px;border:1px solid var(--line);border-radius:17px;background:var(--surface)}.card span{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase}.card b{display:block;margin-top:7px;font-size:20px}.card.inter{grid-column:1/-1;background:linear-gradient(140deg,#08090a,#202126)}.card.inter b{color:#ff9a4e}.card.mp b,.entrada{color:var(--green)}.card.nb b{color:#b58cff}.card.prev b{color:var(--blue)}h2{margin:23px 0 9px;color:var(--muted);font-size:11px;letter-spacing:.09em}.month{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:8px;margin:12px 0}.month button{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:24px}.month strong{text-align:center;text-transform:capitalize}.list{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 13px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.title{font-weight:800;line-height:1.3}.meta{margin-top:4px;color:var(--muted);font-size:10px}.value{font-weight:900;white-space:nowrap}.saida{color:var(--red)}.empty{padding:28px;text-align:center;color:var(--muted)}.refats{display:grid;gap:9px}.refat{padding:13px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.refat-head{display:flex;justify-content:space-between;gap:10px}.refat strong{font-size:13px}.badge{padding:3px 7px;border:1px solid var(--blue);border-radius:999px;color:var(--blue);font-size:9px;font-weight:850}.refat-grid{display:grid;grid-template-columns:1fr auto;gap:6px 10px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11px}.loading{padding:50px 16px;text-align:center;color:var(--muted)}@media(max-width:370px){.cards{grid-template-columns:1fr}.card.inter{grid-column:auto}}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><a class="back" href="./" aria-label="Voltar para a agenda">‹</a><div><p class="ey">DINHEIRO DO CASAL</p><h1>Painel financeiro</h1><p class="muted">Dados compartilhados por João.</p></div><a class="shortcut" href="#sharedRefats" aria-label="Refaturamentos">S</a></header>
    <div class="readonly">Visualização completa · alterações financeiras continuam protegidas na conta principal.</div>
    <div id="content" class="loading">Carregando dados compartilhados…</div>
  </main>
  <script src="./supabase-project-config.js?v=1"></script>
  <script src="./financeiro-compartilhado.js?v=3"></script>
</body>
</html>
