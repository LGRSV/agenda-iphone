<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <meta name="app-page" content="mapa.html">
  <title>Mapa</title>
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=">
  <style>
    :root{color-scheme:dark;--bg:#111216;--surface:#1c1e23;--soft:#24272e;--line:#343943;--text:#f7f8fb;--muted:#9da5b3;--accent:#75cbff;--accentInk:#06263a;--me:#1e88ff;--lugar:#3ecf8e;--tarefa:#ffad42;--red:#ff7f91}
    *{box-sizing:border-box}html,body{height:100%}html{-webkit-text-size-adjust:100%;background:var(--bg)}
    body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
    button{font:inherit;color:inherit}
    .head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:var(--surface);flex:0 0 auto}
    .back{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:var(--soft);text-decoration:none;color:var(--text);font-size:26px;flex:0 0 auto}
    .head h1{margin:0;font-size:20px;letter-spacing:-.02em}.head .sub{margin:2px 0 0;color:var(--muted);font-size:12px}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#666;margin-right:5px;vertical-align:middle}.dot.on{background:var(--lugar)}.dot.err{background:var(--red)}
    .mapwrap{position:relative;flex:0 0 52%;min-height:220px}
    #map{position:absolute;inset:0;background:#dfe3e8}
    .fab{position:absolute;right:12px;z-index:500;display:flex;flex-direction:column;gap:8px;top:12px}
    .fab button{width:44px;height:44px;border:0;border-radius:12px;background:#fff;color:#1a1d22;box-shadow:0 2px 10px rgba(0,0,0,.3);font-size:20px;display:grid;place-items:center}
    .fab button.on{background:var(--me);color:#fff}
    .medida{position:absolute;left:12px;right:68px;top:12px;z-index:500;display:none;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;background:rgba(17,18,22,.92);box-shadow:0 2px 10px rgba(0,0,0,.3);font-size:13px}
    .medida.on{display:flex}.medida b{flex:1;min-width:0}
    .medida a,.medida button{padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft);color:var(--text);text-decoration:none;font-size:12px;font-weight:700}
    .lista{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}
    .lista h2{margin:0;padding:12px 14px 6px;color:var(--muted);font-size:11px;letter-spacing:.07em;text-transform:uppercase}
    .item{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid rgba(52,57,67,.55);cursor:pointer}
    .item:active{background:var(--soft)}
    .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;font-size:17px}
    .ic.lugar{background:rgba(62,207,142,.16)}.ic.tarefa{background:rgba(255,173,66,.16)}
    .info{flex:1;min-width:0}.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .info span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .dist{font-weight:800;font-size:14px;color:var(--accent);white-space:nowrap;flex:0 0 auto}
    .acoes{display:flex;gap:6px;flex:0 0 auto}
    .acoes a{padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);color:var(--text);text-decoration:none;font-size:12px;font-weight:750}
    .acoes a.ir{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
    .vazio{padding:18px 16px;color:var(--muted);font-size:13px;line-height:1.5}
    .eu-pin{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 2px rgba(30,136,255,.35),0 1px 6px rgba(0,0,0,.4)}
    .leaflet-popup-content{margin:10px 12px;font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .leaflet-popup-content a.pl{display:inline-block;margin:6px 6px 0 0;padding:5px 9px;border-radius:8px;background:#eef1f5;color:#123;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <header class="head"><a class="back" href="./" aria-label="Voltar à agenda">‹</a><div style="min-width:0"><h1>Mapa</h1><p class="sub" id="status"><span class="dot"></span>procurando você…</p></div></header>
  <div class="mapwrap">
    <div id="map" aria-label="Mapa"></div>
    <div class="medida" id="medida"><b id="medidaTxt"></b><a id="medidaIr" target="_blank" rel="noopener">Ir</a><button id="medidaX" type="button" aria-label="Fechar">×</button></div>
    <div class="fab">
      <button id="btnSeguir" class="on" type="button" title="Centralizar em mim e seguir" aria-label="Centralizar em mim">◎</button>
      <button id="btnTudo" type="button" title="Ver todos os locais" aria-label="Ver todos os locais">⤢</button>
    </div>
  </div>
  <section class="lista" id="lista"><div class="vazio">Carregando…</div></section>
  <script src="./vendor/leaflet/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="></script>
  <script src="./localizacao.js?v=1"></script>
  <script src="./local-tarefa.js?v=1"></script>
  <script src="./mapa.js?v=1"></script>
</body>
</html>
